{{- $c := dict "ctx" . "component" "scheduler" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yts.fullname" . }}-scheduler
  labels:
    {{- include "yts.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  # One scheduler: no leader election yet (fix 15).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "yts.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yts.labels" . | nindent 8 }}
        app.kubernetes.io/component: scheduler
      annotations:
        checksum/storage: {{ include (print $.Template.BasePath "/storage-config.yaml") . | sha256sum }}
        {{- with .Values.scheduler.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "yts.podSpec" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.scheduler.terminationGracePeriodSeconds }}
      containers:
        - name: scheduler
          image: {{ include "yts.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/ytcollect"]
          args:
            - scheduler
            - -metrics-addr=:{{ .Values.scheduler.opsPort }}
            - -min-stretch={{ .Values.scheduler.minStretch }}
            {{- with .Values.scheduler.fbDiscovery }}
            {{- if .enabled }}
            - -fb-url={{ required "scheduler.fbDiscovery.url is required when fbDiscovery is enabled" .url }}
            - -fb-key-file=/etc/yts-fb-discovery/key
            - -fb-daily={{ .dailyLimit }}
            {{- end }}
            {{- end }}
            {{- range .Values.scheduler.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- include "yts.env" . | nindent 12 }}
            - name: GOMEMLIMIT
              value: {{ .Values.scheduler.goMemLimit | quote }}
          ports:
            - name: ops
              containerPort: {{ .Values.scheduler.opsPort }}
              protocol: TCP
          startupProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: ops}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "yts.volumeMounts" . | nindent 12 }}
            {{- if .Values.scheduler.fbDiscovery.enabled }}
            - name: fb-discovery
              mountPath: /etc/yts-fb-discovery
              readOnly: true
            {{- end }}
      volumes:
        {{- include "yts.volumes" . | nindent 8 }}
        {{- with .Values.scheduler.fbDiscovery }}
        {{- if .enabled }}
        - name: fb-discovery
          secret:
            secretName: {{ required "scheduler.fbDiscovery.secret.name is required when fbDiscovery is enabled" .secret.name }}
            defaultMode: {{ $.Values.secrets.defaultMode }}
            items:
              - key: {{ .secret.key }}
                path: key
        {{- end }}
        {{- end }}
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yts.fullname" . }}-scheduler
  labels:
    {{- include "yts.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  type: ClusterIP
  selector:
    {{- include "yts.selector" $c | nindent 4 }}
  ports:
    - name: ops
      port: {{ .Values.scheduler.opsPort }}
      targetPort: ops
      protocol: TCP
