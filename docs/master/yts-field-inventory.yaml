service: yts
platform: yt
repository: Abdullah95k/securebrand-microservices-youtube
commit: 3db1415
access: {method: "YouTube web endpoints (InnerTube: browse, next, player, search) and RSS over HTTP, plus the official Data API v3 for search only", logged_in: false}
# origin: InnerTube (scraped web API) | Data API v3 (official) | collector (derived by yts)
entities:
  - name: "channel"
    unified: account
    fetched: "Channel page + About panel: tier A every 6 h, B daily, C every 3 days, D and M (mention) weekly. Discovery candidates once, at the candidate check."
    fields:
      - name: "channels.id"
        meaning: "The channel's ID"
        type: "text"
        example: "UCfake0000000000000001"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "browse (channel page): metadata.channelMetadataRenderer.externalId"
        stored_at: "channels.id"
        published_at: "webhook channel.listed .channel_id; video.relevant .channel_id"
        history: "key"
        personal_data: "sometimes"
        notes: "24 characters, starts with UC. Stable for the channel's life. Personal data when the channel is a person's."
      - name: "handle"
        meaning: "The @handle"
        type: "text"
        example: "@fake_channel_1"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "browse: metadata.vanityChannelUrl, else header metadata parts"
        stored_at: "channels.handle (unique, case-insensitive)"
        published_at: "webhook channel.listed .handle"
        history: "versions"
        personal_data: "sometimes"
        notes: "Can change. Each check compares it; a change is logged in channel_changes."
      - name: "title"
        meaning: "Display name"
        type: "text"
        example: "Example Channel"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "browse: metadata.title"
        stored_at: "channels.title"
        published_at: "webhook channel.listed .title; video.relevant .channel_title"
        history: "versions"
        personal_data: "sometimes"
        notes: "Changes logged in channel_changes."
      - name: "description"
        meaning: "The channel description (full)"
        type: "text"
        example: "example text"
        present: often
        present_pct: 92
        origin: "InnerTube (scraped web API)"
        source: "About panel: aboutChannelViewModel.description; else metadata.description"
        stored_at: "channels.description"
        published_at: "not published"
        history: "versions"
        personal_data: "sometimes"
        notes: "Stored verbatim, so links typed into it are kept as text. They are not extracted into a list."
      - name: "keywords"
        meaning: "The channel's own keyword field"
        type: "text"
        example: "fake keyword list"
        present: unknown
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "browse: metadata.keywords"
        stored_at: "channels.keywords"
        published_at: "not published"
        history: "versions"
        personal_data: false
        notes: "Not measured in Phase 0."
      - name: "country"
        meaning: "The country the channel states"
        type: "text"
        example: "Iraq (in Arabic script)"
        present: often
        present_pct: 95
        origin: "InnerTube (scraped web API)"
        source: "About panel: country"
        stored_at: "channels.country"
        published_at: "not published"
        history: "versions"
        personal_data: false
        notes: "A country name in the interface language (we request hl=ar, gl=IQ), not an ISO code."
      - name: "joined_text"
        meaning: "Creation date, as shown"
        type: "text"
        example: "Joined 1 Jan 2015 (in Arabic)"
        present: often
        present_pct: 97
        origin: "InnerTube (scraped web API)"
        source: "About panel: joinedDateText"
        stored_at: "channels.joined_text"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "Day precision, text in the interface language. The column channels.joined_at (date) exists but is never filled."
      - name: "links"
        meaning: "The About panel's external links"
        type: "list of {title, url}"
        example: "[{\"title\":\"Website\",\"url\":\"example.com/fake\"}]"
        present: often
        present_pct: 89
        origin: "InnerTube (scraped web API)"
        source: "About panel: channelExternalLinkViewModel (title, link)"
        stored_at: "channels.links (jsonb)"
        published_at: "not published"
        history: "latest"
        personal_data: "sometimes"
        notes: "The link as the panel displays it (host and path), not YouTube's redirect URL. Replaced when a new non-empty list is read; old lists are not kept (gap)."
      - name: "subscribers"
        meaning: "Subscriber count"
        type: "int64 (lower bound) + text"
        example: "12000 / '12K subscribers'"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "browse header metadata parts; About panel subscriberCountText"
        stored_at: "channels.subscribers_min, subscribers_text; channel_snapshots"
        published_at: "not published"
        history: "snapshots"
        personal_data: false
        notes: "Abbreviated (approximate): stored as the lower bound plus the text. Hidden counts are left empty."
      - name: "videos"
        meaning: "Video count"
        type: "int64 (lower bound)"
        example: "345"
        present: unknown
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "browse header; About panel videoCountText"
        stored_at: "channels.videos_min; channel_snapshots.videos_min"
        published_at: "not published"
        history: "snapshots"
        personal_data: false
        notes: "Can be abbreviated."
      - name: "views"
        meaning: "Total channel views"
        type: "int64"
        example: "12345678"
        present: often
        present_pct: 97
        origin: "InnerTube (scraped web API)"
        source: "About panel: viewCountText"
        stored_at: "channels.views_min; channel_snapshots.views_min"
        published_at: "not published"
        history: "snapshots"
        personal_data: false
        notes: "Normally exact."
      - name: "avatar_url"
        meaning: "Profile picture URL"
        type: "text (URL)"
        example: "https://yt3.ggpht.example/fake-avatar"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "browse: metadata.avatar (largest)"
        stored_at: "channels.avatar_url; the image in object storage (media kind avatar)"
        published_at: "not published"
        history: "versions"
        personal_data: "sometimes"
        notes: "No expiry in the URL; it changes when the picture changes. Images are saved only when storage is configured (off on the pilot)."
      - name: "banner_url"
        meaning: "Banner URL"
        type: "text (URL)"
        example: "https://yt3.ggpht.example/fake-banner"
        present: often
        present_pct: 95
        origin: "InnerTube (scraped web API)"
        source: "browse header (banner)"
        stored_at: "channels.banner_url; media kind banner"
        published_at: "not published"
        history: "versions"
        personal_data: false
        notes: ""
      - name: "family_safe"
        meaning: "YouTube's family-safe flag"
        type: "bool"
        example: "true"
        present: unknown
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "browse: metadata.isFamilySafe"
        stored_at: "channels.family_safe"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: ""
      - name: "tabs"
        meaning: "Which tabs exist (Videos, Shorts, Live, Posts, Playlists) and how to open them"
        type: "map"
        example: "{videos, shorts, streams}"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "browse: tabRenderer"
        stored_at: "not stored (kept in memory for 24 h)"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "Dropped: used only to read the tabs."
      - name: "canonical_url"
        meaning: "The channel's canonical URL"
        type: "text"
        example: "https://www.youtube.com/@fake_channel_1"
        present: often
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "About panel: canonicalChannelUrl"
        stored_at: "not stored"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "Dropped: rebuilt from the ID or handle."
      - name: "verified"
        meaning: "Verified badge on the channel"
        type: "bool"
        example: "true"
        present: unknown
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "channel header badge"
        stored_at: "not collected"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "Gap: not parsed for channels (it is for commenters)."
  - name: "channel_snapshot"
    unified: account_snapshot
    fetched: "Every channel check (see channel)."
    fields:
      - name: "channel_snapshots"
        meaning: "One row per check: subscribers_min, subscribers_text, videos_min, views_min, taken_at"
        type: "row"
        example: "UCfake…, 2026-11-05T10:00:00Z, 12000, '12K', 345, 12345678"
        present: always
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "as for channel"
        stored_at: "channel_snapshots (partitioned by month)"
        published_at: "not published"
        history: "snapshots"
        personal_data: false
        notes: "taken_at is UTC."
      - name: "channel_changes"
        meaning: "One row per changed field: field, old_value, new_value, changed_at"
        type: "row"
        example: "title: 'Old Name' → 'Example Channel'"
        present: sometimes
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "comparison on each check"
        stored_at: "channel_changes"
        published_at: "not published"
        history: "versions"
        personal_data: "sometimes"
        notes: "Fields tracked: handle, title, description, keywords, country, avatar_url, banner_url. Not links (gap)."
  - name: "video"
    unified: post
    fetched: "Seen first in a listing (RSS feed, Videos/Shorts/Live tabs, search). Details (next + player) on the first check. Stats by age, e.g. tier A every 30 min under 2 days, 6 h under 30 days, weekly under a year, monthly after."
    fields:
      - name: "id"
        meaning: "Video ID"
        type: "text"
        example: "fakeVid0001"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "every listing; next; player"
        stored_at: "videos.id"
        published_at: "webhook video.relevant .video_id"
        history: "key"
        personal_data: false
        notes: "11 characters. Stable. Shorts and live streams use the same ID space."
      - name: "channel_id"
        meaning: "Owner channel"
        type: "text"
        example: "UCfake0000000000000001"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "next (owner); listing"
        stored_at: "videos.channel_id"
        published_at: "webhook video.relevant .channel_id"
        history: "key"
        personal_data: "sometimes"
        notes: ""
      - name: "kind"
        meaning: "video, short or live"
        type: "enum: video | short | live"
        example: "short"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "listing (tab, overlay badge) + player isLive / isLiveContent + 'watching now'"
        stored_at: "videos.kind"
        published_at: "webhook video.relevant .kind"
        history: "latest"
        personal_data: false
        notes: ""
      - name: "live_status"
        meaning: "Live state"
        type: "enum: none | upcoming | live | was_live"
        example: "was_live"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "listing badges, player isLive / isLiveContent, watch 'watching now'"
        stored_at: "videos.live_status"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "A finished stream becomes was_live."
      - name: "title"
        meaning: "Title"
        type: "text"
        example: "example title"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "next: videoPrimaryInfoRenderer.title (else player videoDetails.title; listings and RSS on first sight)"
        stored_at: "videos.title"
        published_at: "webhook video.relevant .title"
        history: "versions"
        personal_data: false
        notes: "Edits logged in video_changes."
      - name: "description"
        meaning: "Description (full)"
        type: "text"
        example: "example text"
        present: often
        present_pct: 87
        origin: "InnerTube (scraped web API)"
        source: "next: attributedDescription.content (else player shortDescription)"
        stored_at: "videos.description"
        published_at: "not published"
        history: "versions"
        personal_data: false
        notes: "Full text, not the 'more' preview. Edits logged in video_changes. Links in it are kept as text, not extracted."
      - name: "tags"
        meaning: "The uploader's tags"
        type: "list of text"
        example: "[\"fake tag 1\",\"fake tag 2\"]"
        present: sometimes
        present_pct: 63
        origin: "InnerTube (scraped web API)"
        source: "player: videoDetails.keywords"
        stored_at: "videos.tags"
        published_at: "not published"
        history: "versions"
        personal_data: false
        notes: "Only when the player answers (85% in Phase 0); some videos have none. Edits logged in video_changes."
      - name: "category"
        meaning: "YouTube category"
        type: "text"
        example: "News & Politics"
        present: often
        present_pct: 85
        origin: "InnerTube (scraped web API)"
        source: "player: microformat.category"
        stored_at: "videos.category"
        published_at: "not published"
        history: "versions"
        personal_data: false
        notes: "Only from the player."
      - name: "language"
        meaning: "The video's stated language"
        type: "—"
        example: "—"
        present: unknown
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "player (defaultAudioLanguage) not parsed"
        stored_at: "not collected"
        published_at: "not published"
        history: "—"
        personal_data: false
        notes: "Not collected. Analysis detects language from the text."
      - name: "duration_s"
        meaning: "Length in seconds"
        type: "int"
        example: "754"
        present: always
        present_pct: 94
        origin: "InnerTube (scraped web API)"
        source: "player lengthSeconds (exact); listing lengthText"
        stored_at: "videos.duration_s"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "Seconds."
      - name: "published_at"
        meaning: "When it was published"
        type: "timestamp + precision"
        example: "2026-11-05T07:00:00Z, precision 0"
        present: often
        present_pct: 85
        origin: "InnerTube (scraped web API)"
        source: "player: microformat.publishDate (date-time, exact); else the listing's relative time ('3 hours ago')"
        stored_at: "videos.published_at, published_precision_s"
        published_at: "webhook video.relevant .published_at"
        history: "latest"
        personal_data: false
        notes: "precision_s 0 = exact; 43200 = date only; larger = a relative-time estimate. Only replaced by a more precise value. UTC."
      - name: "published_text"
        meaning: "The date line as shown"
        type: "text"
        example: "'Premiered 5 Nov 2026' (in Arabic)"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "next: dateText"
        stored_at: "videos.published_text"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "Interface language (hl=ar)."
      - name: "upload_date"
        meaning: "Upload date (as opposed to publish date)"
        type: "text"
        example: "2026-11-05T06:00:00-08:00"
        present: often
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "player: microformat.uploadDate"
        stored_at: "not stored"
        published_at: "not published"
        history: "—"
        personal_data: false
        notes: "Dropped: publish date is used."
      - name: "views"
        meaning: "View count"
        type: "int64"
        example: "12345"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "player viewCount (exact); else next originalViewCount (exact); listing (abbreviated)"
        stored_at: "videos.views; video_snapshots.views"
        published_at: "not published"
        history: "snapshots"
        personal_data: false
        notes: "Exact in 100% of Phase 0 checks; matched the official API (median difference 0%)."
      - name: "likes"
        meaning: "Like count"
        type: "int64 (lower bound) + text"
        example: "321 / '321 likes'"
        present: always
        present_pct: 100
        origin: "InnerTube (scraped web API)"
        source: "next: like button accessibility text (exact); else its title"
        stored_at: "videos.likes_min, likes_text; video_snapshots.likes_min"
        published_at: "not published"
        history: "snapshots"
        personal_data: false
        notes: "Exact in 100% of Phase 0 checks. Hidden likes are left empty."
      - name: "comment_count"
        meaning: "Comment count"
        type: "int64 (lower bound) + text"
        example: "1200 / '1.2K'"
        present: often
        present_pct: 70
        origin: "InnerTube (scraped web API)"
        source: "next: comments header (commentsCount, then countText)"
        stored_at: "videos.comments_min, comments_text; video_snapshots.comments_min"
        published_at: "not published"
        history: "snapshots"
        personal_data: false
        notes: "70% on 4 Nov, before the parser fix of 4 Nov (PR #39); not re-measured since. Can be abbreviated."
      - name: "comments_disabled"
        meaning: "Comments are off"
        type: "bool"
        example: "false"
        present: always
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "derived: no comment-section token and no count"
        stored_at: "videos.comments_disabled"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "10 of 228 Phase 0 videos (4%) had no comment section."
      - name: "family_safe"
        meaning: "YouTube's family-safe flag"
        type: "bool"
        example: "true"
        present: often
        present_pct: 85
        origin: "InnerTube (scraped web API)"
        source: "player: microformat.isFamilySafe"
        stored_at: "videos.family_safe"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "The nearest signal to an age restriction. An age-gated video's player answers 'login required': we can't read it, and the status itself is dropped (gap)."
      - name: "members_only"
        meaning: "Members-only video"
        type: "—"
        example: "—"
        present: logged_in_only
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "listing badge not parsed"
        stored_at: "not collected"
        published_at: "not published"
        history: "—"
        personal_data: false
        notes: "Members-only content is not viewable logged out. The badge in listings isn't parsed (gap)."
      - name: "player_unavailable"
        meaning: "Tags and category could not be read"
        type: "bool"
        example: "false"
        present: always
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "collector state"
        stored_at: "videos.player_unavailable"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "The player is asked only on the first check, while live, and for a week while category is missing."
      - name: "chapters"
        meaning: "Chapters"
        type: "list of {title, start_sec}"
        example: "[{\"title\":\"Intro\",\"start_sec\":0}]"
        present: rare
        present_pct: 1
        origin: "InnerTube (scraped web API)"
        source: "next: chapterRenderer / macroMarkersListItemRenderer"
        stored_at: "videos.chapters (jsonb)"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "Seconds."
      - name: "caption_langs"
        meaning: "Caption languages listed"
        type: "list of text"
        example: "[\"ar\",\"ar (auto)\"]"
        present: rare
        present_pct: 0
        origin: "InnerTube (scraped web API)"
        source: "player: captionTracks"
        stored_at: "videos.caption_langs"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "0% in Phase 0 (the player listed none). Caption file URLs are dropped: fetching them needs anti-bot tokens."
      - name: "transcript"
        meaning: "Transcript text"
        type: "—"
        example: "—"
        present: unknown
        present_pct: 0
        origin: "InnerTube (scraped web API)"
        source: "get_transcript"
        stored_at: "not collected"
        published_at: "not published"
        history: "—"
        personal_data: false
        notes: "Phase 0 E12: 0 of 23 transcript requests returned text without an anti-bot token. Dropped (no-go)."
      - name: "thumbnail"
        meaning: "Thumbnail image"
        type: "image (JPEG)"
        example: "https://i.ytimg.example/vi/fakeVid0001/hqdefault.jpg"
        present: always
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "built from the ID: i.ytimg.com/vi/<id>/hqdefault.jpg (480×360)"
        stored_at: "media (kind thumb) + object storage"
        published_at: "not published"
        history: "versions"
        personal_data: false
        notes: "Saved only when storage is configured (off on the pilot). Checked again after 7 days; a new image is a new row (by SHA-256)."
      - name: "live_viewers"
        meaning: "Viewers now, while live"
        type: "int64"
        example: "1500"
        present: sometimes
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "next: 'N watching now'"
        stored_at: "video_snapshots.live_viewers"
        published_at: "not published"
        history: "snapshots"
        personal_data: false
        notes: "Every 5 min (tiers A, B) or 15 min while live."
      - name: "scheduled_start"
        meaning: "Start time of an upcoming stream or premiere"
        type: "timestamp"
        example: "2026-11-06T18:00:00Z"
        present: unknown
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "not parsed"
        stored_at: "videos.scheduled_start (never filled)"
        published_at: "not published"
        history: "—"
        personal_data: false
        notes: "Gap: column exists, not filled."
      - name: "rss_extras"
        meaning: "RSS entry description, thumbnail, views, likes, updated time"
        type: "various"
        example: "—"
        present: always
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "feeds/videos.xml"
        stored_at: "not stored"
        published_at: "not published"
        history: "—"
        personal_data: false
        notes: "Dropped: the watch page gives the same, fresher. The RSS published time IS used (exact)."
      - name: "removed_at"
        meaning: "When the video disappeared"
        type: "timestamp"
        example: "2026-11-05T12:00:00Z"
        present: rare
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "derived: two missed checks in a row"
        stored_at: "videos.removed_at, missed_checks"
        published_at: "not published"
        history: "latest"
        personal_data: false
        notes: "Cleared if it comes back."
      - name: "source"
        meaning: "How we first saw it (provenance)"
        type: "enum: web | tab | rss | websub | web_search | api_search"
        example: "rss"
        present: always
        present_pct: null
        origin: "collector"
        source: "collector"
        stored_at: "videos.source"
        published_at: "not published"
        history: "key"
        personal_data: false
        notes: "Set on first sight and never changed. An 'api_search' row starts with the Data API's title and publish time; the scraped read queued at once replaces them. If that read never succeeds, the API values stay (a gap against the API's 30-day rule)."
      - name: "relevant, matched_keywords"
        meaning: "Iraq relevance and why"
        type: "bool, list of text"
        example: "true, [\"place-baghdad\"]"
        present: always
        present_pct: null
        origin: "InnerTube (scraped web API)"
        source: "collector (keyword matcher on title, description, tags)"
        stored_at: "videos.relevant, matched_keywords"
        published_at: "webhook video.relevant .matched_keywords"
        history: "latest"
        personal_data: false
