# The production stack on one server (plan §7.2, §8.2). From this folder:
#
#   docker compose build
#   docker compose up -d
#
# Steps, secret files and day-to-day commands: docs/production-runbook.md.
#
# Sized for a small machine: 4 vCPU and 16 GB of memory (REQ-010 fix 2).
# Every container has a memory limit (no swap), a CPU limit and a process
# limit, so a runaway process is stopped alone and never takes the machine
# down (standard B2). Together the limits come to about 12 GB, leaving the
# rest to the system. The Go services also get GOMEMLIMIT a little under
# their limit, so they collect garbage before they hit it. For a bigger
# machine, see docs/production-runbook.md step 5.
#
# Secrets are files in /etc/securebrand-youtube on the host (chmod 600,
# owned by the collector's user 65532), mounted read-only; nothing secret is
# in this file, the image or the environment. Data lives in /var/lib/securebrand-youtube and the Postgres
# volume. Monitoring ports listen on 127.0.0.1 only (reach them through an
# SSH tunnel).
name: securebrand-youtube

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-ytcollect: &ytcollect
  image: securebrand-youtube:latest
  # The defaults for the small services; worker and scheduler set their own.
  mem_limit: 256m
  memswap_limit: 256m
  cpus: 0.5
  pids_limit: 256
  build:
    context: ../..
  entrypoint: ["/usr/local/bin/ytcollect"]
  # Never root (REQ-010 fix 13, standard A2): user 65532, no capabilities,
  # no privilege gain, a read-only root filesystem. The programs write only
  # under /var/lib/securebrand-youtube and /tmp. The secret files and that
  # folder belong to 65532 on the host (runbook step 5).
  user: "65532:65532"
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  environment:
    # Push notifications (D23): set in .env next to this file; empty is off.
    YT_WEBSUB_CALLBACK: ${YT_WEBSUB_CALLBACK:-}
    GOMEMLIMIT: 200MiB
  volumes:
    - /etc/securebrand-youtube:/etc/securebrand-youtube:ro
    - /var/lib/securebrand-youtube:/var/lib/securebrand-youtube
  depends_on:
    migrate:
      condition: service_completed_successfully
  logging: *logging

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ytcollect
      POSTGRES_DB: ytcollect
      POSTGRES_PASSWORD_FILE: /run/ytcollect/postgres_password
    volumes:
      # The PostgreSQL 18 image keeps its data under /var/lib/postgresql/18
      # (PGDATA); the volume is mounted one level up, as that image expects.
      - pgdata:/var/lib/postgresql
      - /etc/securebrand-youtube/postgres_password:/run/ytcollect/postgres_password:ro
    # Tuned for 16 GB with an 8 GB container limit: shared_buffers a quarter
    # of the limit, effective_cache_size what the machine's page cache can
    # hold for it. The runbook (step 5) gives the settings for bigger
    # machines.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_connections=100
      - -c
      - max_worker_processes=4
      - -c
      - max_parallel_workers=4
      - -c
      - max_parallel_workers_per_gather=2
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=4GB
      - -c
      - random_page_cost=1.1
    shm_size: 1g
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 2
    pids_limit: 512
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytcollect -d ytcollect"]
      interval: 10s
      timeout: 5s
      retries: 30
    logging: *logging

  # Creates and updates the tables, then exits; the services wait for it.
  migrate:
    <<: *ytcollect
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  # Maintenance: partitions, missing jobs, privacy audit, archive, capacity,
  # keyword suggestions, metrics (:9102) and outgoing webhooks.
  scheduler:
    <<: *ytcollect
    command: ["scheduler"]
    # The archiver builds compressed monthly parts in memory.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    environment:
      YT_WEBSUB_CALLBACK: ${YT_WEBSUB_CALLBACK:-}
      GOMEMLIMIT: 850MiB

  # The collector. -interval: the gap between requests on one proxy IP.
  # Phase 0 (E1) found every page type clean down to 1 s per IP except the
  # player, which the collector now asks sparingly; 2 s leaves a margin.
  # -workers: jobs at the same time.
  # On a stop, running jobs get 20 s (-drain) to finish, then they are handed
  # back; the grace period leaves room for that before Docker kills it.
  worker:
    <<: *ytcollect
    command: ["worker", "-interval", "2s", "-workers", "10", "-drain", "20s"]
    stop_grace_period: 30s
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    environment:
      YT_WEBSUB_CALLBACK: ${YT_WEBSUB_CALLBACK:-}
      GOMEMLIMIT: 850MiB

  # Push notifications (D23: off until a public subdomain exists). Start
  # with: docker compose --profile websub up -d. Put HTTPS (Caddy, nginx) in
  # front of 127.0.0.1:8080.
  websub:
    <<: *ytcollect
    profiles: ["websub"]
    command: ["websub"]
    ports:
      - "127.0.0.1:8080:8080"

  # Daily database dumps; the last 30 days are kept here (copy them off the
  # server too: see the runbook). A restored dump brings back erased data
  # until the next privacy audit, so run "privacy-audit" right after one.
  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - /var/lib/securebrand-youtube/backups:/backups
      - /etc/securebrand-youtube/postgres_password:/run/ytcollect/postgres_password:ro
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
    pids_limit: 128
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f="/backups/ytcollect-$$(date -u +%Y%m%dT%H%MZ).dump"
          if PGPASSWORD="$$(cat /run/ytcollect/postgres_password)" pg_dump -h postgres -U ytcollect -d ytcollect -Fc -f "$$f.part"; then
            mv "$$f.part" "$$f"
            find /backups -name 'ytcollect-*.dump' -mtime +30 -delete
          else
            echo "backup failed; the partial file is replaced next time" >&2
          fi
          sleep 86400
        done
    logging: *logging

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=400d
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 0.5
    pids_limit: 256
    volumes:
      - ../prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    logging: *logging

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.25
    pids_limit: 64
    volumes:
      - ../alertmanager:/etc/alertmanager:ro
      - /etc/securebrand-youtube:/etc/securebrand-youtube:ro
      - amdata:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    logging: *logging

volumes:
  pgdata:
  promdata:
  amdata:
