{{- if or .Values.storage.media.enabled .Values.storage.raw.enabled -}}
# The object-storage settings the programs read (YT_STORAGE_FILE,
# YT_RAW_STORAGE_FILE). No secrets: the keys stay in their secret files.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "yts.fullname" . }}-storage
  labels:
    {{- include "yts.labels" . | nindent 4 }}
data:
  {{- range $file, $s := dict "storage.json" .Values.storage.media "raw_storage.json" .Values.storage.raw }}
  {{- if $s.enabled }}
  {{- $c := dict "type" "s3" "virtual_host" $s.virtualHost "access_key_file" $s.accessKeyFile "secret_key_file" $s.secretKeyFile }}
  {{- if $s.prefix }}
  {{- $_ := set $c "prefix" $s.prefix }}
  {{- end }}
  {{- if $s.fromPlatformCredentials }}
  {{- $_ := set $c "endpoint_file" "/etc/platform-credentials/S3_ENDPOINT" }}
  {{- $_ := set $c "region_file" "/etc/platform-credentials/S3_REGION" }}
  {{- $_ := set $c "bucket_file" (printf "/etc/platform-credentials/%s" $s.bucketKey) }}
  {{- else }}
  {{- $_ := set $c "endpoint" $s.endpoint }}
  {{- $_ := set $c "region" $s.region }}
  {{- $_ := set $c "bucket" $s.bucket }}
  {{- end }}
  {{ $file }}: |
    {{- $c | toJson | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}
