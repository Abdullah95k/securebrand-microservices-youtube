# Alerts from plan §8.13. Labels carry job kinds, tiers and opaque proxy
# IDs only: never names, comment text or credentials.
groups:
  - name: scraping
    rules:
      - alert: PoolBrakeEngaged
        expr: min(yt_pool_speed) < 1
        for: 10m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "The proxy pool slowed down: more than 20% of IPs are blocked"
      - alert: ProxyQuarantined
        expr: yt_proxies_quarantined > 0
        for: 15m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "{{ $value }} proxy IP(s) in quarantine"
      # Every IP quarantined (the owner, 11 November): from the database,
      # through the scheduler, so it fires even while the worker isn't Ready
      # or isn't scraped. Meanwhile the worker takes no jobs.
      - alert: AllProxiesQuarantined
        expr: max(yt_proxies_quarantined) > 0 and max(yt_proxies_quarantined) >= max(yt_proxies_reporting)
        for: 10m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "Every proxy IP is quarantined ({{ $value }}): nothing is collected"
          description: "See 'ytcollect proxies'; once the IPs are replaced or the blocks have passed, 'ytcollect proxies release -all'."
      # REQ-010 fix 7 (standard C5): the pool can't run dry unnoticed. Fewer
      # than 3 usable IPs, or under half the pool, for 15 minutes. Player
      # rests don't count: the player is blocked often by design.
      - alert: ProxiesHealthyLow
        expr: (yt_proxies_healthy < 3 and yt_proxies_total >= 3) or (yt_proxies_healthy < 0.5 * yt_proxies_total)
        for: 15m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "Only {{ $value }} usable proxy IP(s) on {{ $labels.worker }}: collection slows to a crawl"
          description: "Check yt_proxy_blocks_total for a block storm, and add or replace IPs (docs/production-runbook.md §7)."
      - alert: FillRateDrop
        expr: (yt_fill_rate < 0.7 * yt_fill_rate_baseline) and yt_fill_rate_baseline > 0.5
        for: 30m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "{{ $labels.endpoint }}.{{ $labels.field }} is present far less often than usual: YouTube may have changed the page"
      - alert: ParseFailureSpike
        expr: yt_parse_failures_24h > 100
        for: 15m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "{{ $value }} pages could not be parsed in 24 hours; skeletons are in the debug folder"
      - alert: CanaryFailing
        expr: yt_canary_targets > 0 and yt_canary_channels_ok == 0
        for: 30m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "No canary channel could be read and parsed"
      - alert: MonitorStale
        expr: time() - yt_monitor_timestamp_seconds > 600
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "System metrics are not being refreshed (is the scheduler running?)"
      - alert: CapacityPlanStale
        expr: time() - yt_capacity_report_timestamp_seconds > 7200
        for: 10m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "The newest capacity plan is over 2 hours old: the stretch and the IP advice are out of date"
          description: "The planner runs hourly in the scheduler. Look in the scheduler's log for 'scheduler task failed' with task=capacity."
  - name: freshness
    rules:
      - alert: FreshnessDebtGrowing
        expr: delta(sum(yt_freshness_debt_hours)[24h:1h]) > 0 and sum(yt_freshness_debt_hours) > 100
        for: 1h
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "Overdue work has grown for 24 hours; capacity recommends {{ with query \"yt_capacity_recommended_ips\" }}{{ . | first | value }}{{ end }} IPs"
      - alert: CommentCompletenessLow
        expr: yt_comments_complete_pct < 90
        for: 6h
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "Comments collected are under 90% of the displayed counts"
      - alert: WebSubRenewalsFailing
        expr: yt_queue_failing{kind="websub"} > 0
        for: 1h
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#12-push-notifications-later-d23"
          summary: "Push subscriptions are failing to renew; feeds and tab checks still find uploads"
      - alert: APIQuotaExhausted
        expr: yt_api_quota_cap_units > 0 and yt_api_quota_used_units >= 0.95 * yt_api_quota_cap_units
        for: 30m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "The official API quota is almost used up for today (resets at midnight Pacific time)"
  - name: privacy
    rules:
      - alert: ErasureRequestOverdue
        expr: yt_erasure_oldest_pending_seconds > 172800
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#8-erasure-requests"
          summary: "An erasure request has waited more than 48 hours (the plan allows 72)"
      - alert: SuppressionViolation
        expr: yt_suppression_violations > 0
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#8-erasure-requests"
          summary: "Erased items were found in the database (they were erased again); find out how they came back"
      - alert: ArchiveErasureOverdue
        expr: yt_archive_unscrubbed_seconds > 172800
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#10-the-archive"
          summary: "An erasure has not reached the archive files for 48 hours: check the scheduler's archive scrub"
  - name: storage
    rules:
      - alert: ArchiverBehind
        expr: max(yt_partition_oldest_age_days) > 430
        for: 2d
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#10-the-archive"
          summary: "A month older than 14 months is still in Postgres: the archiver is not running (is object storage configured?)"
      - alert: MediaBacklog
        expr: yt_media_jobs_due > 50000
        for: 6h
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "{{ $value }} image downloads are waiting"
  - name: webhooks
    rules:
      - alert: WebhookDeadLetters
        expr: yt_webhook_deliveries{status="dead"} > 0
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#11-webhooks"
          summary: "{{ $value }} webhook deliveries to {{ $labels.endpoint }} gave up; fix the receiver, then: ytcollect webhooks retry -endpoint {{ $labels.endpoint }}"
      - alert: WebhookBacklog
        expr: yt_webhook_oldest_pending_seconds > 3600
        for: 15m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#11-webhooks"
          summary: "Events for {{ $labels.endpoint }} have waited more than an hour: the receiver is failing or the scheduler is not running"
  - name: queue
    rules:
      # REQ-010 fix 3 (standards C1, C3): a job that failed too often for
      # reasons of its own stops being retried. It stays dead until someone
      # fixes the cause and requeues it.
      - alert: DeadJobs
        expr: sum by (kind) (yt_queue_dead) > 0
        for: 10m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
          summary: "{{ $value }} dead {{ $labels.kind }} job(s): not retried until requeued"
          description: "See the reasons with 'ytcollect jobs dead'; after the fix, 'ytcollect jobs requeue -kind {{ $labels.kind }}'."
  - name: outbox
    rules:
      # Fix 12. Events wait for Kafka: only an alert once a relay has run in
      # the last day (the pilot runs without Kafka, and its events wait on
      # purpose). It also catches a relay that stopped: its last report of
      # yt_relay_up stays in the day's window.
      - alert: OutboxBacklog
        expr: max(yt_outbox_oldest_unsent_seconds) > 1800 and on() max(max_over_time(yt_relay_up[1d])) == 1
        for: 15m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#16-the-outbox-and-the-relay"
          summary: "Events have waited more than 30 minutes for Kafka (the oldest: {{ $value | humanizeDuration }})"
          description: "The relay is behind, failing or stopped: see its log and yt_relay_transactions_total; 'ytcollect outbox' shows what waits."
      # An event the contract refuses, or Kafka can't take, is never sent
      # until the cause is fixed.
      - alert: OutboxRefused
        expr: sum(yt_outbox_failed) > 0
        for: 10m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#16-the-outbox-and-the-relay"
          summary: "{{ $value }} outbox event(s) refused: not sent to Kafka"
          description: "'ytcollect outbox check' lists them with the reason; after the fix, restarting the relay tries them again."
      # The media hand-off (contract R5): an announced image must be gone
      # from storage by its deadline. The relay deletes what is due every 10
      # minutes; still there an hour later, deleting is failing or stopped.
      - alert: MediaPastDeadline
        expr: sum(yt_media_past_deadline) > 0
        for: 30m
        annotations:
          runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#17-the-media-hand-off"
          summary: "{{ $value }} image(s) still stored past their deadline"
          description: "The relay could not delete them (its log: 'deleting an analysed file failed'), or it is stopped; yt_media_delete_failures_total counts the failures."
