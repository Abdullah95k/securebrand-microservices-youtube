{{- include "yts.checkStorage" . -}}
{{- $c := dict "ctx" . "component" "worker" -}}
{{- if gt (int .Values.worker.replicas) 1 -}}
{{- fail "worker.replicas must be 1: each worker paces every proxy IP itself, so two would double the rate on the same IPs (fix 15 lifts this)" -}}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "yts.fullname" . }}-worker
  labels:
    {{- include "yts.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  # Replaced, never doubled: one process paces the proxy IPs.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "yts.selector" $c | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "yts.labels" . | nindent 8 }}
        app.kubernetes.io/component: worker
      annotations:
        checksum/storage: {{ include (print $.Template.BasePath "/storage-config.yaml") . | sha256sum }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "yts.podSpec" . | nindent 6 }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      containers:
        - name: worker
          image: {{ include "yts.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/ytcollect"]
          args:
            - worker
            - -interval={{ .Values.worker.interval }}
            - -workers={{ .Values.worker.workers }}
            - -suggested-daily={{ .Values.worker.suggestedDaily }}
            - -no-player={{ not .Values.worker.player }}
            - -comment-cap={{ .Values.worker.commentCap }}
            - -drain={{ .Values.worker.drain }}
            - -backfill-days={{ .Values.worker.backfillDays }}
            - -raw-sample={{ .Values.worker.rawSample }}
            - -raw-30d={{ .Values.worker.raw30d }}
            {{- with .Values.worker.mediaHold }}
            - -media-hold={{ join "," . }}
            {{- end }}
            - -metrics-addr=:{{ .Values.worker.opsPort }}
            {{- range .Values.worker.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            {{- include "yts.env" . | nindent 12 }}
            - name: YT_PROXIES_FILE
              value: /etc/yts-proxies/{{ .Values.secrets.proxies.key }}
            - name: GOMEMLIMIT
              value: {{ .Values.worker.goMemLimit | quote }}
          ports:
            - name: ops
              containerPort: {{ .Values.worker.opsPort }}
              protocol: TCP
          startupProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /healthz, port: ops}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: ops}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            {{- include "yts.volumeMounts" . | nindent 12 }}
            - name: proxies
              mountPath: /etc/yts-proxies
              readOnly: true
      volumes:
        {{- include "yts.volumes" . | nindent 8 }}
        - name: proxies
          secret:
            secretName: {{ .Values.secrets.proxies.name }}
            defaultMode: {{ .Values.secrets.defaultMode }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "yts.fullname" . }}-worker
  labels:
    {{- include "yts.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  type: ClusterIP
  selector:
    {{- include "yts.selector" $c | nindent 4 }}
  ports:
    - name: ops
      port: {{ .Values.worker.opsPort }}
      targetPort: ops
      protocol: TCP
