{{- if .Values.prometheusRule.enabled -}}
# The alerts of deploy/prometheus/alerts.yml (CI checks the copy in files/
# is the same), each with a runbook link.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "yts.fullname" . }}
  labels:
    {{- include "yts.labels" . | nindent 4 }}
    {{- with .Values.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- .Files.Get "files/alerts.yml" | nindent 2 }}
{{- end }}
