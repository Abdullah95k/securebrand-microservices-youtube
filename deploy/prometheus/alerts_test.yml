# Unit tests for alert rules (promtool test rules), run in CI. Synthetic
# series only.
rule_files:
  - alerts.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'yt_proxies_healthy{worker="w1"}'
        values: '10x5 2x30'
      - series: 'yt_proxies_total{worker="w1"}'
        values: '10x35'
      - series: 'yt_queue_dead{kind="media"}'
        values: '0x5 4x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: ProxiesHealthyLow
        exp_alerts: []
      - eval_time: 25m
        alertname: ProxiesHealthyLow
        exp_alerts:
          - exp_labels: {worker: w1}
            exp_annotations:
              summary: "Only 2 usable proxy IP(s) on w1: collection slows to a crawl"
              description: "Check yt_proxy_blocks_total for a block storm, and add or replace IPs (docs/production-runbook.md §7)."
              runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
      - eval_time: 10m
        alertname: DeadJobs
        exp_alerts: []
      - eval_time: 20m
        alertname: DeadJobs
        exp_alerts:
          - exp_labels: {kind: media}
            exp_annotations:
              summary: "4 dead media job(s): not retried until requeued"
              description: "See the reasons with 'ytcollect jobs dead'; after the fix, 'ytcollect jobs requeue -kind media'."
              runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#7-watching-it"
  # The outbox: no alert while no relay has ever run (the pilot); with a
  # relay, a backlog older than 30 minutes for 15 minutes, and any refusal.
  - interval: 1m
    input_series:
      - series: 'yt_outbox_oldest_unsent_seconds'
        values: '0x5 3600x40'
      - series: 'yt_outbox_failed'
        values: '0x5 3x20'
    alert_rule_test:
      - eval_time: 30m
        alertname: OutboxBacklog
        exp_alerts: []
      - eval_time: 20m
        alertname: OutboxRefused
        exp_alerts:
          - exp_annotations:
              summary: "3 outbox event(s) refused: not sent to Kafka"
              description: "'ytcollect outbox check' lists them with the reason; after the fix, restarting the relay tries them again."
              runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#16-the-outbox-and-the-relay"
  - interval: 1m
    input_series:
      - series: 'yt_outbox_oldest_unsent_seconds'
        values: '0x5 3600x40'
      - series: 'yt_relay_up{instance="relay-1"}'
        values: '1x45'
    alert_rule_test:
      - eval_time: 15m
        alertname: OutboxBacklog
        exp_alerts: []
      - eval_time: 25m
        alertname: OutboxBacklog
        exp_alerts:
          - exp_annotations:
              summary: "Events have waited more than 30 minutes for Kafka (the oldest: 1h 0m 0s)"
              description: "The relay is behind, failing or stopped: see its log and yt_relay_transactions_total; 'ytcollect outbox' shows what waits."
              runbook_url: "https://github.com/Abdullah95k/securebrand-microservices-youtube/blob/main/docs/production-runbook.md#16-the-outbox-and-the-relay"
