name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: go (format, vet, test, fixture scan)
    runs-on: ubuntu-24.04
    services:
      # The database tests run against a throwaway Postgres; each test gets
      # its own schema (internal/db/dbtest).
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: yttest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      YT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/yttest?sslmode=disable
      YT_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "Not gofmt-formatted:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: fixture scanner (no real data or secrets in the repo)
        run: go run ./cmd/fixturescan .

  docker:
    name: docker (ytprobe image builds)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t ytprobe:ci .
      - name: image runs and prints its usage
        run: |
          docker run --rm ytprobe:ci help
          docker run --rm --entrypoint /usr/local/bin/ytcollect ytprobe:ci help
      - name: production Compose file is valid
        run: docker compose -f deploy/compose/docker-compose.yml config -q
      - name: Prometheus and Alertmanager configs are valid
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/etc/prometheus:ro" prom/prometheus:v2.55.1 check config /etc/prometheus/prometheus.yml
          docker run --rm --entrypoint amtool -v "$PWD/deploy/alertmanager:/etc/alertmanager:ro" prom/alertmanager:v0.27.0 check-config /etc/alertmanager/alertmanager.yml

  secrets:
    name: gitleaks (secret scan of full history)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.24.0
      GITLEAKS_SHA256: cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: install gitleaks (pinned version and checksum)
        run: |
          f="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$f"
          echo "${GITLEAKS_SHA256}  $f" | sha256sum --check
          tar -xzf "$f" gitleaks
      - name: scan
        run: ./gitleaks git --redact --verbose .
