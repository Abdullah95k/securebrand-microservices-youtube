# Prometheus for the SecureBrand YouTube collector (plan §8.13).
# The services expose /metrics: workers on :9101, the scheduler on :9102.
global:
  scrape_interval: 30s
  evaluation_interval: 1m

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ytcollect-worker
    static_configs:
      - targets: ["worker:9101"]
  - job_name: ytcollect-scheduler
    static_configs:
      - targets: ["scheduler:9102"]

# Alerts go to Alertmanager (deploy/alertmanager), which sends them to the
# receiver you configure there (D20).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
