# Production on the platform's cluster (REQ-010 fix 14). The platform's
# pipeline adds the image:
#   helm upgrade --install yts deploy/helm/yts -n yts \
#     -f deploy/helm/yts/values-production.yaml \
#     --set image.repository=REGISTRY/yts --set image.digest=sha256:…
#

database:
  platformCredentials: true

# Object storage: the platform's buckets, endpoint, region and keys, all
# from platform-credentials (the master, 6 November). Raw responses under
# yts/keep/ and yts/30d/; images under yts/ in the media bucket.
storage:
  media:
    enabled: true
    fromPlatformCredentials: true
    bucketKey: S3_BUCKET_MEDIA
    prefix: "yts/"
  raw:
    enabled: true
    fromPlatformCredentials: true
    bucketKey: S3_BUCKET_RAW

worker:
  replicas: 1
  # Phase 0 (E1): every page type clean down to 1 s per IP except the
  # player, which is asked sparingly; 2 s leaves a margin.
  interval: 2s
  workers: 10
  drain: 20s
  # The pilot starts with 7 days of past uploads per channel (REQ-010 fix
  # 11); raise to 365 after it.
  backfillDays: 7
  rawSample: "0.01"
  raw30d: true

websub:
  enabled: false

# The master's ranges (6 November): the managed services in the production
# VPC on the ports their secret gives; the schema registry in namespace
# platform; HTTPS anywhere; the proxy exits (not bought yet) on the ports of
# proxies.yaml, to any address until their addresses exist.
networkPolicy:
  enabled: true
  monitoringNamespace: monitoring
  egress:
    httpsCIDRs: ["0.0.0.0/0"]
    managedServices:
      cidrs: ["10.20.0.0/16"]
    schemaRegistry:
      enabled: true
    proxies:
      cidrs: ["0.0.0.0/0"]
