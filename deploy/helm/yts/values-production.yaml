# Production on the platform's cluster (REQ-010 fix 14). The platform's
# pipeline adds the image:
#   helm upgrade --install yts deploy/helm/yts -n yts \
#     -f deploy/helm/yts/values-production.yaml \
#     --set image.repository=REGISTRY/yts --set image.digest=sha256:…
#

# The registry's pull secret (DigitalOcean's registry integration adds it
# to the namespace's default service account only; yts's pods run as their
# own account, so they name it themselves). The master, 7 November.
imagePullSecrets:
  - name: securebrand

database:
  platformCredentials: true

# Object storage: the platform's buckets, endpoint, region and keys, all
# from platform-credentials (the master, 6 November). Raw responses under
# yts/keep/ and yts/30d/; images under yts/ in the media bucket.
storage:
  media:
    enabled: true
    fromPlatformCredentials: true
    bucketKey: S3_BUCKET_MEDIA
    prefix: "yts/"
  raw:
    enabled: true
    fromPlatformCredentials: true
    bucketKey: S3_BUCKET_RAW

worker:
  replicas: 1
  # Phase 0 (E1): every page type clean down to 1 s per IP except the
  # player, which is asked sparingly; 2 s leaves a margin.
  interval: 2s
  # 30 jobs at once for the 44 IPs (D-060, 13 November): one job reads one
  # page after another, so 10 jobs would make at most about 30,000-36,000
  # requests an hour, below what 44 IPs give (about 41,000 at 70% busy).
  workers: 30
  drain: 20s
  # The pilot starts with 7 days of past uploads per channel (REQ-010 fix
  # 11); raise to 365 after it.
  backfillDays: 7
  rawSample: "0.01"
  raw30d: true
  # The owner, D-061 (13 November): "youtube thumbnails turned on" (it
  # replaces D-052's "Not now for thumbnails"). Listed channels' avatars and
  # banners are collected for analysis (D-050; D-061: "yes i need them").
  # Commenters' avatars are held: D-061 covers listed channels only, and
  # keeping commenters' pictures was never decided (7 November question).
  mediaHold: [author_avatar]

websub:
  enabled: false

# The relay to the platform's Kafka (fix 12): off for the pilot, which runs
# without Kafka (the owner); events wait in the outbox meanwhile
# ("ytcollect outbox" shows them, "ytcollect outbox check" checks them).
# On with Kafka: relay.enabled=true, and canary=true while the canary runs.
relay:
  enabled: false
  canary: false

# The master's ranges (6 November): the managed services in the production
# VPC on the ports their secret gives; the schema registry in namespace
# platform; HTTPS anywhere; the proxy exits (not bought yet) on the ports of
# proxies.yaml, to any address until their addresses exist.
networkPolicy:
  enabled: true
  monitoringNamespace: monitoring
  egress:
    httpsCIDRs: ["0.0.0.0/0"]
    # The production VPC in London (the master, 7 November: D-030; it was
    # Frankfurt's 10.20.0.0/16). The ports are given here because Argo CD
    # renders the chart with "helm template", where the chart can't read
    # them from platform-credentials: 5432 is PgBouncer (the only PostgreSQL
    # port), 25073 Kafka. yts uses no Valkey.
    managedServices:
      cidrs: ["10.30.0.0/16"]
      ports: [5432, 25073]
    schemaRegistry:
      enabled: true
    proxies:
      cidrs: ["0.0.0.0/0"]
